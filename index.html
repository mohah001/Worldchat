
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorldChat - Meet the World</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .account, .friends {
      max-width: 450px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      color: #101827;
      border-radius: 12px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
    }
    .friend {
      padding: 12px;
      margin: 10px 0;
      background: #eef2f7;
      border-radius: 8px;
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <h1>🌍 WorldChat</h1>
    <p>One world. Millions of conversations.</p>
  </header>

  <main>
    <section class="welcome">
      <h2>Meet people around the world</h2>
      <p>Make international friends and discover new cultures.</p>
    </section>

    <section class="account">
      <h2>Join WorldChat</h2>

      <div id="accountForm">
        <input id="name" placeholder="Your name">
        <input id="country" placeholder="Your country">
        <input id="email" type="email" placeholder="Your email">
        <input id="password" type="password" placeholder="Password (6+ characters)">
        <button onclick="register()">Create Account</button>
        <button onclick="login()">Login</button>
      </div>

      <div id="userArea" hidden>
        <h3 id="userWelcome"></h3>
        <button onclick="findFriends()">Find Friends 🌍</button>
        <button onclick="logout()">Logout</button>
      </div>

      <p id="status" aria-live="polite"></p>
    </section>

    <section class="friends" id="friendsArea" hidden>
      <h2>🌍 Find Friends</h2>
      <input id="countrySearch" placeholder="Search by country">
      <button onclick="findFriends()">Search</button>
      <div id="friendList"></div>
    </section>
  </main>

  <footer><p>© 2026 WorldChat</p></footer>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBYCRgvs3_A0Ph7R3nW21GONpCDQFJQhOk",
      authDomain: "worldchat-67ec4.firebaseapp.com",
      projectId: "worldchat-67ec4",
      storageBucket: "worldchat-67ec4.firebasestorage.app",
      messagingSenderId: "319447383919",
      appId: "1:319447383919:web:1dde647d2041618933729a"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function showStatus(message) {
      document.getElementById("status").textContent = message;
    }

    async function register() {
      const name = document.getElementById("name").value.trim();
      const country = document.getElementById("country").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!name || !country || !email || !password) {
        showStatus("Please fill in all fields.");
        return;
      }

      try {
        const result = await auth.createUserWithEmailAndPassword(email, password);
        await result.user.updateProfile({ displayName: name });

        const profile = {
          name: name,
          country: country,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        await db.collection("users").doc(result.user.uid).set({
          ...profile,
          email: email
        });

        await db.collection("publicProfiles").doc(result.user.uid).set(profile);

        showStatus("Welcome! Your account and profile are saved.");
      } catch (error) {
        showStatus(error.message);
      }
    }

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        const privateProfile = await db.collection("users").doc(result.user.uid).get();

        if (privateProfile.exists) {
          const data = privateProfile.data();
          await db.collection("publicProfiles").doc(result.user.uid).set({
            name: data.name || result.user.displayName || "WorldChat member",
            country: data.country || "Not specified"
          }, { merge: true });
        }

        showStatus("Login successful!");
      } catch (error) {
        showStatus(error.message);
      }
    }

    async function findFriends() {
      const list = document.getElementById("friendList");
      const search = document.getElementById("countrySearch").value.trim().toLowerCase();

      list.textContent = "Finding members...";

      try {
        const snapshot = await db.collection("publicProfiles").get();
        list.innerHTML = "";

        let count = 0;

        snapshot.forEach(doc => {
          const person = doc.data();

          if (doc.id === auth.currentUser.uid) return;

          if (search && !(person.country || "").toLowerCase().includes(search)) return;

          const card = document.createElement("div");
          card.className = "friend";

          const name = document.createElement("strong");
          name.textContent = person.name || "WorldChat member";

          const country = document.createElement("p");
          country.textContent = "📍 " + (person.country || "Not specified");

          card.appendChild(name);
          card.appendChild(country);
          list.appendChild(card);
          count++;
        });

        if (count === 0) {
          list.textContent = "No other members found yet. Invite a friend to join!";
        }
      } catch (error) {
        list.textContent = "Could not load members: " + error.message;
      }
    }

    function logout() {
      auth.signOut().then(() => showStatus("You have logged out."));
    }

    auth.onAuthStateChanged(user => {
      document.getElementById("accountForm").hidden = !!user;
      document.getElementById("userArea").hidden = !user;
      document.getElementById("friendsArea").hidden = !user;

      if (user) {
        document.getElementById("userWelcome").textContent =
          "Welcome, " + (user.displayName || user.email) + "!";
      } else {
        document.getElementById("friendList").textContent = "";
      }
    });
  </script>
</body>
  </html>
