
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorldChat - Meet the World</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .account {
      max-width: 400px;
      margin: 25px auto;
      padding: 20px;
      background: white;
      color: #101827;
      border-radius: 12px;
    }
    .account input, .account button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <h1>🌍 WorldChat</h1>
    <p>One world. Millions of conversations.</p>
  </header>

  <main>
    <section class="welcome">
      <h2>Meet people around the world</h2>
      <p>Make international friends and discover new cultures.</p>
    </section>

    <section class="account">
      <h2>Join WorldChat</h2>

      <div id="accountForm">
        <input id="name" placeholder="Your name">
        <input id="country" placeholder="Your country">
        <input id="email" type="email" placeholder="Your email">
        <input id="password" type="password" placeholder="Password (6+ characters)">
        <button onclick="register()">Create Account</button>
        <button onclick="login()">Login</button>
      </div>

      <div id="userArea" hidden>
        <h3 id="userWelcome"></h3>
        <button onclick="logout()">Logout</button>
      </div>

      <p id="status" aria-live="polite"></p>
    </section>
  </main>

  <footer><p>© 2026 WorldChat</p></footer>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBYCRgvs3_A0Ph7R3nW21GONpCDQFJQhOk",
      authDomain: "worldchat-67ec4.firebaseapp.com",
      projectId: "worldchat-67ec4",
      storageBucket: "worldchat-67ec4.firebasestorage.app",
      messagingSenderId: "319447383919",
      appId: "1:319447383919:web:1dde647d2041618933729a"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function showStatus(message) {
      document.getElementById("status").textContent = message;
    }

    async function register() {
      const name = document.getElementById("name").value.trim();
      const country = document.getElementById("country").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!name || !country || !email || !password) {
        showStatus("Please fill in all fields.");
        return;
      }

      try {
        const result = await auth.createUserWithEmailAndPassword(email, password);
        await result.user.updateProfile({ displayName: name });

        await db.collection("users").doc(result.user.uid).set({
          name: name,
          country: country,
          email: email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        showStatus("Welcome! Your account and profile are saved.");
      } catch (error) {
        showStatus(error.message);
      }
    }

    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      auth.signInWithEmailAndPassword(email, password)
        .then(() => showStatus("Login successful!"))
        .catch(error => showStatus(error.message));
    }

    function logout() {
      auth.signOut()
        .then(() => showStatus("You have logged out."));
    }

    auth.onAuthStateChanged(user => {
      document.getElementById("accountForm").hidden = !!user;
      document.getElementById("userArea").hidden = !user;

      if (user) {
        document.getElementById("userWelcome").textContent =
          "Welcome, " + (user.displayName || user.email) + "!";
      }
    });
  </script>
</body>
</html>
